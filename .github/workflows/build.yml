name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: msbuild AsserPlayer.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: msbuild AsserPlayer.sln /t:Build /p:Configuration=Release /p:Platform=x64 /m

      - name: Static repository checks
        run: python tests/verify_structure.py
